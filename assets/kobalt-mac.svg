<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kobalt macOS icon</title>
  <desc id="desc">The dark six-bar Kobalt mark on a white rounded square with a thin gray edge and a soft shadow.</desc>
  <!-- The tile follows the macOS icon grid: 824 units with a 100-unit margin. The mark has the same
       proportions as assets/kobalt-android.svg. The shadow is stacked shapes, because lunasvg has no blur. -->
  <g fill="#000">
    <rect x="96" y="108" width="832" height="832" rx="189" fill-opacity="0.04"/>
    <rect x="98" y="106" width="828" height="828" rx="187" fill-opacity="0.05"/>
    <rect x="100" y="104" width="824" height="824" rx="185" fill-opacity="0.06"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#fff"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="4"/>
  <g transform="translate(363.4 352) scale(5.08)" fill="#161616">
    <rect y="0" width="58.5" height="6.5"/>
    <rect y="11.3" width="58.5" height="6.5"/>
    <rect y="22.6" width="58.5" height="6.5"/>
    <rect y="33.9" width="58.5" height="6.5"/>
    <rect y="45.2" width="58.5" height="6.5"/>
    <rect y="56.5" width="42.3" height="6.5"/>
  </g>
</svg>
