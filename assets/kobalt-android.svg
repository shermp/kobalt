<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 124 124" role="img" aria-labelledby="title desc">
  <title id="title">Kobalt Android icon</title>
  <desc id="desc">The dark six-bar Kobalt mark on a white rounded square with a thin gray edge.</desc>
  <!-- Same mark and proportions as platforms/android/app/res/drawable/kobalt_mark.xml, scaled from 108 to 124. -->
  <rect width="124" height="124" rx="28" fill="#fff"/>
  <!-- A thin inside edge keeps the white tile visible on a light toolbar. Android draws no edge. -->
  <rect x="1.1" y="1.1" width="121.8" height="121.8" rx="26.9" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="2.2"/>
  <g transform="translate(39.6 37.9) scale(0.7654)" fill="#161616">
    <rect y="0" width="58.5" height="6.5"/>
    <rect y="11.3" width="58.5" height="6.5"/>
    <rect y="22.6" width="58.5" height="6.5"/>
    <rect y="33.9" width="58.5" height="6.5"/>
    <rect y="45.2" width="58.5" height="6.5"/>
    <rect y="56.5" width="42.3" height="6.5"/>
  </g>
</svg>
